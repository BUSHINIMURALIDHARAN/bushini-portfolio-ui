<section class="section section--alt" id="skills" aria-labelledby="skills-title">
  <div class="container">
    <app-section-heading
      index="02"
      label="Skills"
      titleId="skills-title"
      title="The stack I work with"
      lead="Day-to-day tools from enterprise projects, plus the technologies I use in my own builds."
    />

    <div class="grid">
      @for (group of groups; track group.title; let i = $index) {
        <article class="card group" [appReveal]="(i % 2) * 120" appTilt>
          <div class="head">
            <span class="tile"><app-icon [name]="group.icon" /></span>
            <div>
              <h3>{{ group.title }}</h3>
              <p>{{ group.blurb }}</p>
            </div>
          </div>
          <ul class="chips">
            @for (item of group.items; track item) {
              <li class="chip">{{ item }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
