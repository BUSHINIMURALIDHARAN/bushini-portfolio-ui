<section class="hero" id="home" aria-labelledby="hero-title" appParallax>
  <div class="hero-bg" aria-hidden="true"></div>

  <div class="container hero-grid">
    <div class="copy">
      <p class="status">
        <span class="pulse"></span>
        {{ profile.role }} at {{ profile.company }}
      </p>

      <h1 id="hero-title">
        Hi, I'm <span class="grad-text">{{ profile.name }}</span>
      </h1>

      <p class="typed">
        <span class="sr-only">{{ profile.title }}</span>
        <span aria-hidden="true"><span class="prompt">&gt;</span>{{ typed() }}<span class="caret"></span></span>
      </p>

      <p class="lead">{{ profile.summary }}</p>

      <div class="cta">
        <a class="btn btn-primary" href="#projects">
          View my work
          <app-icon name="arrow-right" />
        </a>
        <a class="btn btn-outline" [href]="profile.resume" [attr.download]="profile.resumeName">
          <app-icon name="download" />
          Download résumé
        </a>
      </div>

      <ul class="socials" aria-label="Social links">
        @for (social of socials; track social.label) {
          <li>
            <a class="icon-btn" [href]="social.href" [attr.aria-label]="social.label" target="_blank" rel="noopener">
              <app-icon [name]="social.icon" />
            </a>
          </li>
        }
      </ul>

      <dl class="stats">
        @for (stat of stats; track stat.label) {
          <div>
            <dt>{{ stat.value }}</dt>
            <dd>{{ stat.label }}</dd>
          </div>
        }
      </dl>
    </div>

    <app-hero-visual />
  </div>
</section>
