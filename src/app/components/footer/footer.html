<footer class="footer">
  <div class="container inner">
    <div>
      <p class="brand">Bushini<span>.</span></p>
      <p class="copy">&copy; {{ year }} {{ profile.name }}. Built with Angular.</p>
    </div>

    <nav aria-label="Footer">
      <ul class="links">
        @for (link of links; track link.id) {
          <li><a [href]="'#' + link.id">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <ul class="socials" aria-label="Social links">
      @for (social of socials; track social.label) {
        <li>
          <a class="icon-btn" [href]="social.href" [attr.aria-label]="social.label" target="_blank" rel="noopener">
            <app-icon [name]="social.icon" />
          </a>
        </li>
      }
    </ul>
  </div>

  <a class="to-top" href="#home" aria-label="Back to top" [class.show]="spy.scrolled()">
    <app-icon name="arrow-up" />
  </a>
</footer>
