<section class="section" id="experience" aria-labelledby="experience-title">
  <div class="container">
    <app-section-heading index="03" label="Experience" titleId="experience-title" title="Where I've been building" />

    <ol class="timeline">
      @for (job of jobs; track job.company) {
        <li class="item" appReveal>
          <span class="node" aria-hidden="true"></span>
          <article class="card job">
            <header>
              <div>
                <h3>{{ job.role }}</h3>
                <p class="company">{{ job.company }}</p>
              </div>
              <span class="chip">{{ job.period }}</span>
            </header>

            <ul class="points">
              @for (point of job.points; track point) {
                <li>
                  <app-icon name="check" />
                  <span>{{ point }}</span>
                </li>
              }
            </ul>

            <ul class="chips">
              @for (tech of job.stack; track tech) {
                <li class="chip">{{ tech }}</li>
              }
            </ul>
          </article>
        </li>
      }
    </ol>
  </div>
</section>
