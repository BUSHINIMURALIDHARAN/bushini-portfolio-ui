<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found | Bushini M</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0d14">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: #0a0d14;
      color: #e9ecf5;
      font: 400 16px/1.7 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .code {
      margin: 0;
      background: linear-gradient(120deg, #ff5d73, #ff8a6b 48%, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 700;
      line-height: 1;
    }
    h1 { margin: 16px 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 28px; color: #9ba5bb; }
    a {
      display: inline-block;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      background: linear-gradient(120deg, #ff5d73, #ff8a6b 48%, #a78bfa);
      color: #14070a;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
